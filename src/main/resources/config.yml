# ═══════════════════════════════════════════════════════════════
# MaceWind Configuration
# ═══════════════════════════════════════════════════════════════
# Only change these id a) you know what you are doing
# and b) you dont want a vanilla experience!
# ── Mace ─────────────────────────────────────────────────────
mace:
  # Vanilla base damage (Java Edition 1.21 = 7.0)
  base-damage: 7.0

  # Blocks of fall before smash bonus activates
  fall-threshold: 1.5

  # Tiered smash bonus (vanilla formula):
  #   blocks 1-3  → tier1-per-block  (+4 each)
  #   blocks 4-8  → tier2-per-block  (+2 each)
  #   blocks 9+   → tier3-per-block  (+1 each)
  tier1-per-block: 4.0
  tier1-blocks: 3.0
  tier2-per-block: 2.0
  tier2-blocks: 8.0
  tier3-per-block: 1.0

  hit-debounce-ms: 50

  knockback:
    horizontal-multiplier: 0.5
    horizontal-bonus-cap: 1.2
    vertical-base: 0.3
    vertical-bonus-cap: 0.5

  feedback:
    enable-sound: true
    sound: ANVIL_LAND
    enable-effect: true
    effect: STEP_SOUND
    effect-data: 42
    action-message-enabled: true
    action-message-template: "Crushing Blow! +{bonus} damage"

  # Mace enchantment tuning
  enchants:
    # Density (max V): extra smash damage per block fallen, per level
    density-per-block-per-level: 0.5

    # Breach (max IV): percentage of target armor bypassed per level
    breach-percent-per-level: 15.0

    # Wind Burst (max III): upward launch velocity after a smash hit
    wind-burst-base-launch: 0.6
    wind-burst-per-level: 0.35

# ── Wind Charge ──────────────────────────────────────────────
windcharge:
  radius: 2.5
  area-knockback: 0.35
  direct-hit-knockback: 0.5
  direct-hit-damage: 1.0
  self-boost-velocity: 1.2
  cooldown-ticks: 10
  prevent-block-damage: true
  feedback:
    enable-sound: true
    sound: ENTITY_ENDERDRAGON_FLAP
    enable-effect: true
    effect: SMOKE
    effect-data: 10

# ── Firework / Elytra Boost ──────────────────────────────────
firework:
  launch-speed: 1.4
  boost-horizontal: 1.6
  boost-vertical: 0.6
  boost-preserve-y: 0.2
  feedback:
    sound: ENTITY_FIREWORK_LAUNCH
    effect-visual: true

# ── Item names ───────────────────────────────────────────────
items:
  mace-name: "Mace"
  windcharge-name: "Wind Charge"

# ── Misc ─────────────────────────────────────────────────────
compatibility:
  use-bukkit-only: true

debug:
  verbose-logging: false
